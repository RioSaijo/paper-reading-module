name: Deploy PDF to Pages
on:
  workflow_run:
    workflows: ['Build PDF']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Reject a PDF from an older source revision
        env:
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          test -f .pdf-source.sha
          SOURCE_SHA="$(cat .pdf-source.sha)"
          if [ -n "$TRIGGER_SHA" ] && [ "$SOURCE_SHA" != "$TRIGGER_SHA" ]; then
            echo "PDF does not belong to the completed build."
            exit 1
          fi
          git diff --exit-code "$SOURCE_SHA" HEAD -- '*.tex' '*.bib' '*.bst' '.latexmkrc' metadata scripts .github/workflows
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/configure-pages@v5
      - run: node scripts/pages.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
