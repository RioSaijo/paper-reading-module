name: Build PDF
on:
  push:
    branches: [main]
    paths:
      - 'papers/**/*.tex'
      - 'sections/**/*.tex'
      - 'main.tex'
      - 'references.bib'
      - 'macro*.tex'
      - '*.bst'
      - '.latexmkrc'
      - 'metadata/**'
      - 'review_queue/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-pdf-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Japanese LaTeX and PDF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-lang-japanese texlive-latex-extra poppler-utils
      - run: npm test
      - run: npm run validate
      - name: Compile Japanese LaTeX
        run: npm run build:pdf
      - name: Check citations and prepare PDF
        run: |
          if grep -Eq 'Citation .* undefined|There were undefined references' main.log; then
            exit 1
          fi
          cp main.pdf paper-reading-notes.pdf
      - uses: actions/upload-artifact@v6
        with:
          name: paper-reading-notes
          path: paper-reading-notes.pdf
      - name: Save root PDF if source is still current
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Newer source exists; skip stale publication."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add paper-reading-notes.pdf
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: regenerate reading notes"
          git push origin HEAD:main
